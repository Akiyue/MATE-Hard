name: MultiAgentTracking(4v8, 9, fast)
# Same scenario as MATE-4v8-9 but with a much shorter horizon for training
# wall-clock. Evaluate trained policies on the original MATE-4v8-9.yaml
# (max_episode_steps=10000) for the paper-table numbers.
max_episode_steps: 1500            # int in [0, +inf)  <-- SHORT
num_cargoes_per_target: 8          # int in [4, +inf)
high_capacity_target_split: 0.5    # float in [0.0, 1.0]
targets_start_with_cargoes: true   # bool (true / false)
bounty_factor: 1.0                 # float in [0.0, +inf)
shuffle_entities: true             # bool (true / false)
reward_type: dense                 # literal (dense / sparse)

camera:
  location_random_range:  # 4 cameras
    - [  500,  800,  500,  800 ]
    - [  500,  800, -800, -500 ]
    - [ -800, -500, -800, -500 ]
    - [ -800, -500,  500,  800 ]

  min_viewing_angle: 30.0
  max_sight_range: 1500.0
  rotation_step: 5.0
  zooming_step: 2.5
  radius: 40.0

target:
  location_random_range:  # 8 targets
    - [ -200,  200, -200,  200 ]
    - [ -200,  200, -200,  200 ]
    - [ -200,  200, -200,  200 ]
    - [ -200,  200, -200,  200 ]
    - [ -200,  200, -200,  200 ]
    - [ -200,  200, -200,  200 ]
    - [ -200,  200, -200,  200 ]
    - [ -200,  200, -200,  200 ]

  step_size: 20.0
  sight_range: 500.0

obstacle:
  location_random_range:  # 9 obstacles
    - [  200,  800,  200,  800 ]
    - [  200,  800, -800, -200 ]
    - [ -800, -200, -800, -200 ]
    - [ -800, -200,  200,  800 ]

    - [  900,  900, -500,  500 ]
    - [ -500,  500,  900,  900 ]
    - [ -900, -900, -500,  500 ]
    - [ -500,  500, -900, -900 ]

    - [ -200,  200, -200,  200 ]

  radius_random_range: [ 25.0, 100.0 ]
  transmittance: 0.1
